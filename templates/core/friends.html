{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="kicker">TRUST CIRCLE</p><h1>Друзья</h1></div></div><section class="two-col"><div class="panel"><h2>Найти по Anonymous ID</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button class="button">Отправить запрос</button></form></div><div class="panel"><h2>Входящие запросы</h2>{% for item in incoming %}<p class="post-mini">{{ item.user_from.pseudonym }} <a href="{% url 'friend_action' item.pk 'accept' %}">Принять</a> <a href="{% url 'friend_action' item.pk 'reject' %}">Отклонить</a></p>{% empty %}<p class="muted">Новых запросов нет.</p>{% endfor %}</div></section>{% endblock %}
