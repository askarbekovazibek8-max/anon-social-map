{% extends 'base.html' %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}{% block content %}<div class="page-head"><div><p class="kicker">BISHKEK / PRIVATE MAP</p><h1>Интерактивная карта</h1></div><a class="button" href="{% url 'save_location' %}">Моя локация</a></div><div id="map"></div><p class="privacy-hint">Метка не публична. Координаты видны только после явного разрешения и могут быть отключены в любой момент.</p><script>const map=L.map('map').setView([42.8746,74.5698],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('Ваша позиция (только вам)').openPopup()},()=>{});}</script>{% endblock %}
